<section class="applications-page">
  <h2>My Applications</h2>

  <p *ngIf="isLoading">Loading...</p>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div *ngIf="!isLoading && applications.length === 0 && !errorMessage" class="empty-box">
    You have not submitted any applications yet.
  </div>

  <div *ngIf="!isLoading && applications.length > 0" class="applications-list">
    <div class="application-card" *ngFor="let app of applications">
      <div class="application-left">
        <h3>{{ app.university_name }} — {{ app.country }}</h3>
        <p>
          Applied: {{ app.created_at | date:'dd MMM yyyy' }} · Spring 2025
        </p>
      </div>

      <div class="application-actions">
        <div class="application-status">
          {{ app.status || 'Pending' }}
        </div>

        <button class="cancel-btn" type="button" (click)="cancelApplication(app.id)">
          Cancel
        </button>
      </div>
    </div>
  </div>
</section>
